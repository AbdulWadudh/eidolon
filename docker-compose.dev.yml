services:
  storage:
    image: rustfs/rustfs:latest
    container_name: eidolon-storage
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: eidolon
      RUSTFS_SECRET_KEY: eidolon_local_dev
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    volumes:
      - s3-data:/data
      - s3-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "rustfs --version > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  s3-data:
    name: eidolon-s3-data
  s3-logs:
    name: eidolon-s3-logs
