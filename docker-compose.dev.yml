services:
  storage:
    image: rustfs/rustfs:latest
    container_name: eidolon-storage
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: eidolon
      RUSTFS_SECRET_KEY: eidolon_local_dev
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    volumes:
      - s3-data:/data
      - s3-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "rustfs --version > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  cache:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: eidolon-cache
    restart: unless-stopped
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"
    command:
      - "--logtostderr"
      - "--cache_mode=true"
      - "--proactor_threads=2"
      - "--maxmemory=512mb"
    volumes:
      - cache-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

volumes:
  cache-data:
    name: eidolon-cache-data
  s3-data:
    name: eidolon-s3-data
  s3-logs:
    name: eidolon-s3-logs
