services:
  conductor:
    build:
      context: .
      dockerfile: apps/conductor/Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_CONDUCTOR_3000
      - PORT=3000
      - HOST=0.0.0.0
      - EIDOLON_DATA_DIR=/data/eidolon

      - PAIRING_SECRET=${SERVICE_PASSWORD_PAIRING}

      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-eidolon-media}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}

      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - EXA_API_KEY=${EXA_API_KEY:-}
      - LLM_API_URL=${LLM_API_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - COMFYUI_URL=${COMFYUI_URL:-}
    volumes:
      - eidolon-data:/data/eidolon
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:3000/health'); process.exit(r.ok ? 0 : 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  eidolon-data:
